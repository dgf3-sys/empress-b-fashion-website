<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Empress B | African Fashion & Beading</title>
  <meta name="description" content="Empress B creates beautiful African fashion, elegant dresses and exquisite beaded designs. Explore our styles and order through WhatsApp.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --dark: #17120f;
      --dark2: #251b16;
      --gold: #d7a84b;
      --gold2: #f1cf7a;
      --cream: #fffaf2;
      --white: #ffffff;
      --muted: #756a62;
      --border: #eadfd2;
      --soft: #f8f1e8;
      --green: #16844b;
      --red: #b52d2d;
      --shadow: 0 12px 35px rgba(23,18,15,.10);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--dark);
      line-height: 1.6;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* https://uldqpureopmjzgqnndbf.supabase.co
       CONFIGURATION
    sb_publishable__Dp9MknPGgaSN5EHB6JG5A_kSfWerAm */

    .announcement {
      background: var(--dark);
      color: white;
      text-align: center;
      padding: 9px 15px;
      font-size: 13px;
    }

    .announcement strong {
      color: var(--gold2);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,250,242,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      min-width: 42px;
      height: 42px;
      padding: 0 11px;
    }

    .icon-btn:hover {
      border-color: var(--gold);
    }

    .mobile-menu {
      display: none;
    }

    /* HERO */

    .hero {
      min-height: 620px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(20,14,10,.92), rgba(20,14,10,.58), rgba(20,14,10,.15)),
        url("https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?auto=format&fit=crop&w=1800&q=85")
        center/cover;
      color: white;
    }

    .hero-content {
      max-width: 650px;
      padding: 80px 0;
    }

    .eyebrow {
      display: inline-block;
      color: var(--gold2);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(45px, 8vw, 82px);
      line-height: .98;
      margin-bottom: 22px;
    }

    .hero p {
      color: #f4e9dc;
      font-size: 18px;
      max-width: 570px;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-weight: bold;
      transition: .2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-gold {
      background: var(--gold);
      color: var(--dark);
    }

    .btn-dark {
      background: var(--dark);
      color: white;
    }

    .btn-light {
      background: white;
      color: var(--dark);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dark);
    }

    .btn-whatsapp {
      background: var(--green);
      color: white;
    }

    /* SECTIONS */

    section {
      padding: 75px 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .section-head h2 {
      font-family: Georgia, serif;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.05;
    }

    .section-head p {
      color: var(--muted);
      max-width: 550px;
    }

    .center-head {
      text-align: center;
      display: block;
    }

    .center-head p {
      margin: 12px auto 0;
    }

    /* CATEGORIES */

    .categories {
      background: var(--soft);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .category-card {
      border: none;
      border-radius: var(--radius);
      min-height: 220px;
      padding: 22px;
      color: white;
      text-align: left;
      display: flex;
      align-items: end;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      box-shadow: var(--shadow);
    }

    .category-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 25%, rgba(0,0,0,.75));
    }

    .category-card div {
      position: relative;
      z-index: 1;
    }

    .category-card h3 {
      font-family: Georgia, serif;
      font-size: 25px;
    }

    .category-card p {
      font-size: 13px;
      opacity: .9;
    }

    /* STYLE INSPIRATION */

    .style-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .style-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .style-image {
      height: 280px;
      width: 100%;
      object-fit: cover;
      background: #eee;
    }

    .style-body {
      padding: 17px;
    }

    .style-body h3 {
      font-family: Georgia, serif;
      font-size: 21px;
      margin-bottom: 5px;
    }

    .style-body p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 15px;
    }

    .style-actions {
      display: flex;
      gap: 8px;
    }

    .style-actions .btn {
      flex: 1;
      font-size: 12px;
      padding: 10px;
    }

    /* PRODUCTS */

    .products-section {
      background: var(--soft);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: white;
    }

    .filter-select {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      padding: 13px;
      outline: none;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .product-card img {
      width: 100%;
      height: 290px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 17px;
    }

    .product-info h3 {
      font-family: Georgia, serif;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .product-info p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .price {
      color: var(--gold);
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 13px;
    }

    .product-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .product-buttons .btn {
      font-size: 12px;
      padding: 10px;
    }

    .empty {
      text-align: center;
      padding: 45px 15px;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    /* GALLERY */

    .gallery-grid {
      columns: 4 220px;
      column-gap: 15px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 15px;
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      background: #eee;
    }

    .gallery-item img {
      width: 100%;
      min-height: 220px;
      object-fit: cover;
    }

    .gallery-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 35px 15px 15px;
      color: white;
      background: linear-gradient(transparent, rgba(0,0,0,.75));
    }

    /* VIDEOS */

    .video-section {
      background: var(--dark);
      color: white;
    }

    .video-section .section-head p {
      color: #cdbfb2;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .video-card {
      background: #251b16;
      border: 1px solid #3a2c24;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .video-card video {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      background: black;
    }

    .video-info {
      padding: 16px;
    }

    .video-info h3 {
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .video-info p {
      color: #cdbfb2;
      font-size: 13px;
    }

    /* ADVERTISEMENT */

    .ads-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .ad-card {
      min-height: 250px;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      background: var(--dark);
      color: white;
    }

    .ad-card img {
      width: 100%;
      height: 100%;
      min-height: 250px;
      object-fit: cover;
      opacity: .65;
    }

    .ad-content {
      position: absolute;
      inset: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
    }

    .ad-content h3 {
      font-family: Georgia, serif;
      font-size: 30px;
    }

    /* WHY US */

    .why {
      background: var(--soft);
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .why-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }

    .why-icon {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .why-card h3 {
      font-family: Georgia, serif;
      margin-bottom: 8px;
    }

    .why-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* ABOUT */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: center;
    }

    .about-image {
      width: 100%;
      height: 500px;
      object-fit: cover;
      border-radius: 25px;
    }

    .about-text h2 {
      font-family: Georgia, serif;
      font-size: 45px;
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .about-text p {
      color: var(--muted);
      margin-bottom: 15px;
    }

    /* CONTACT */

    .contact {
      background: var(--dark);
      color: white;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .contact h2 {
      font-family: Georgia, serif;
      font-size: 45px;
    }

    .contact p {
      color: #d5c7bc;
    }

    .contact-box {
      background: #251b16;
      padding: 25px;
      border-radius: var(--radius);
    }

    .contact-line {
      display: flex;
      gap: 12px;
      margin-bottom: 17px;
      align-items: center;
    }

    /* FOOTER */

    footer {
      background: #0d0a08;
      color: #cbbeb1;
      padding: 45px 0 25px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    footer h3 {
      color: white;
      margin-bottom: 12px;
      font-family: Georgia, serif;
    }

    footer p,
    footer a {
      font-size: 13px;
    }

    footer a {
      display: block;
      margin-bottom: 7px;
    }

    footer a:hover {
      color: var(--gold);
    }

    .copyright {
      border-top: 1px solid #2a211c;
      padding-top: 20px;
      text-align: center;
      font-size: 12px;
    }

    /* CART */

    .cart-drawer {
      position: fixed;
      right: -430px;
      top: 0;
      width: min(410px, 92%);
      height: 100vh;
      background: white;
      z-index: 3000;
      box-shadow: -15px 0 45px rgba(0,0,0,.2);
      transition: .3s;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    .drawer-head {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-body {
      flex: 1;
      overflow: auto;
      padding: 18px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item img {
      width: 70px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
    }

    .cart-item h4 {
      font-size: 15px;
    }

    .cart-item small {
      color: var(--muted);
    }

    .cart-footer {
      padding: 18px;
      border-top: 1px solid var(--border);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 13px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 2500;
      display: none;
    }

    .overlay.show {
      display: block;
    }

    /* MODALS */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 4000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 20px;
      padding: 25px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      right: 15px;
      top: 15px;
      border: none;
      background: #f3eee8;
      border-radius: 50%;
      width: 35px;
      height: 35px;
    }

    .modal-box h2 {
      font-family: Georgia, serif;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .message {
      padding: 10px;
      border-radius: 9px;
      margin-bottom: 12px;
      font-size: 13px;
      display: none;
    }

    .message.show {
      display
