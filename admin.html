<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empress B Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3f6;
      color: #241d23;
    }

    header {
      background: #24131f;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .box, .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .login {
      max-width: 450px;
      margin: 50px auto;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
    }

    button {
      border: 0;
      padding: 12px 16px;
      margin: 4px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #8b285f;
      color: white;
    }

    .dark {
      background: #24131f;
      color: white;
    }

    .danger {
      background: #c62828;
      color: white;
    }

    .light {
      background: #eee;
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      gap: 5px;
      margin-bottom: 20px;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 15px;
    }

    .item img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      display: none;
    }

    .success {
      display: block;
      background: #e4f6e8;
      color: #17652a;
    }

    .error {
      display: block;
      background: #fde5e5;
      color: #9b1c1c;
    }

    .hidden {
      display: none !important;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .on {
      background: #dff5e5;
      color: #17652a;
    }

    .off {
      background: #f8dddd;
      color: #8a1c1c;
    }
  </style>
</head>

<script>

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable__Dp9MknPGgaSN5EHB6JG5A_kSfWerAm";


/* IMPORTANT:
   Replace the two values above with the SAME
   values already working in your index.html.

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY

const loginBox =
  document.getElementById("loginBox");

const dashboard =
  document.getElementById("dashboard");

const loginMessage =
  document.getElementById("loginMessage");

const mainMessage =
  document.getElementById("mainMessage");


function message(element, text, error = false) {

  element.textContent = text;

  element.className =
    "message " + (error ? "error" : "success");

}


function clearMessage(element) {

  element.textContent = "";
  element.className = "message";

}


/* LOGIN */

document
  .getElementById("loginButton")
  .addEventListener("click", async function () {

    clearMessage(loginMessage);

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      message(
        loginMessage,
        "Please enter your email and password.",
        true
      );

      return;
    }

    const button = this;

    button.disabled = true;
    button.textContent = "Logging in...";

    try {

      const result =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (result.error) {
        throw result.error;
      }

      const user = result.data.user;

      const role =
        user &&
        user.app_metadata &&
        user.app_metadata.role;

      if (role !== "admin") {

        await supabaseClient.auth.signOut();

        throw new Error(
          "This account is not an administrator."
        );
      }

      loginBox.classList.add("hidden");
      dashboard.classList.remove("hidden");

      message(
        mainMessage,
        "Login successful. Welcome to your admin dashboard!"
      );

      loadEverything();

    } catch (error) {

      message(
        loginMessage,
        error.message || "Login failed.",
        true
      );

    } finally {

      button.disabled = false;
      button.textContent = "Login";

    }

  });


/* LOGOUT */

document
  .getElementById("logoutButton")
  .addEventListener("click", async function () {

    await supabaseClient.auth.signOut();

    dashboard.classList.add("hidden");
    loginBox.classList.remove("hidden");

  });


/* TABS */

document
  .querySelectorAll("[data-tab]")
  .forEach(button => {

    button.addEventListener("click", function () {

      document
        .querySelectorAll(".tab")
        .forEach(tab =>
          tab.classList.remove("active")
        );

      document
        .getElementById(this.dataset.tab)
        .classList.add("active");

    });

  });


/* IMAGE UPLOAD */

async function uploadImage(file, folder) {

  if (!file) {
    throw new Error("Please choose an image.");
  }

  const extension =
    file.name.split(".").pop();

  const filename =
    folder +
    "/" +
    Date.now() +
    "-" +
    Math.random().toString(36).substring(2) +
    "." +
    extension;

  const upload =
    await supabaseClient.storage
      .from("product-images")
      .upload(filename, file);

  if (upload.error) {
    throw upload.error;
  }

  const publicUrl =
    supabaseClient.storage
      .from("product-images")
      .getPublicUrl(filename);

  return publicUrl.data.publicUrl;
}


/* PRODUCTS */

document
  .getElementById("addProductButton")
  .addEventListener("click", addProduct);


async function addProduct() {

  try {

    const file =
      document.getElementById("productImage").files[0];

    const name =
      document.getElementById("productName").value.trim();

    const description =
      document.getElementById("productDescription").value.trim();

    const price =
      Number(document.getElementById("productPrice").value);

    if (!file || !name || !price) {
      throw new Error(
        "Please choose an image, enter a name and enter a price."
      );
    }

    message(mainMessage, "Uploading product...");

    const imageUrl =
      await uploadImage(file, "products");

    const result =
      await supabaseClient
        .from("products")
        .insert({
          name: name,
          description: description,
          price_ngn: price,
          image_url: imageUrl,
          available: true
        });

    if (result.error) {
      throw result.error;
    }

    document.getElementById("productImage").value = "";
    document.getElementById("productName").value = "";
    document.getElementById("productDescription").value = "";
    document.getElementById("productPrice").value = "";

    message(mainMessage, "Product added successfully!");

    loadProducts();

  } catch (error) {

    message(mainMessage, error.message, true);

  }

}


async function loadProducts() {

  const box =
    document.getElementById("productsList");

  box.innerHTML = "Loading products...";

  const result =
    await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (result.error) {

    box.innerHTML =
      "<p>" + result.error.message + "</p>";

    return;
  }

  if (!result.data.length) {

    box.innerHTML =
      "<p>No products yet.</p>";

    return;
  }

  box.innerHTML =
    result.data.map(product => `

      <div class="card item">

        <img src="${safe(product.image_url)}">

        <h3>${safe(product.name)}</h3>

        <p>${safe(product.description || "")}</p>

        <strong>
          ₦${Number(product.price_ngn).toLocaleString()}
        </strong>

        <p>
          <span class="status ${
            product.available ? "on" : "off"
          }">
            ${product.available ? "Available" : "Unavailable"}
          </span>
        </p>

        <button class="light"
          onclick="toggleProduct('${product.id}', ${product.available})">
          ${product.available ? "Hide Product" : "Show Product"}
        </button>

        <button class="danger"
          onclick="deleteProduct('${product.id}')">
          Delete
        </button>

      </div>

    `).join("");

}


async function toggleProduct(id, current) {

  const result =
    await supabaseClient
      .from("products")
      .update({
        available: !current
      })
      .eq("id", id);

  if (result.error) {

    message(
      mainMessage,
      result.error.message,
      true
    );

    return;
  }

  loadProducts();
}


async function deleteProduct(id) {

  if (!confirm("Delete this product?")) return;

  const result =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);

  if (result.error) {

    message(
      mainMessage,
      result.error.message,
      true
    );

    return;
  }

  message(mainMessage, "Product deleted.");

  loadProducts();
}
