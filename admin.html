<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empress B — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 2px;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #b42318;
    }

    #dashboard {
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f1f1;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>EMPRESS B</h1>
  <p>Admin Dashboard</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h2>Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">Login</button>

    <div id="loginMessage" class="message hidden"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="card">
      <h2>Welcome, Empress B 👑</h2>
      <p>You are successfully logged in as administrator.</p>

      <button class="danger" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Product Management</h2>
      <p>
        Your product upload and management tools will appear here next.
      </p>
    </div>

  </div>

</div>

<script>
  const SUPABASE_URL = "https://uldqpureopmjzgqnndbf.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable__Dp9MknPGgaSN5EHB6JG5A_kSfWerAm";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("loginMessage");

    message.classList.remove("hidden");
    message.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      message.textContent = error.message;
      return;
    }

    const role =
      data.user?.app_metadata?.role;

    if (role !== "admin") {
      await supabaseClient.auth.signOut();
      message.textContent = "Access denied. Admin account required.";
      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
  }

  async function logout() {
    await supabaseClient.auth.signOut();

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginBox").style.display = "block";

    document.getElementById("password").value = "";
  }
</script>

</body>
</html>
